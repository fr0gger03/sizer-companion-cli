on:
  push:
    tags:
      - 'v*'  # Trigger on version tag pushes

permissions:
  contents: write  # Allows creating releases and uploading assets

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]  # Define platforms

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Specify Python version

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller  # Install PyInstaller

      - name: Build Executable
        run: |
          pyinstaller --onefile your_script.py  # Build the executable

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/your_script  # Path to the built executable
          asset_name: your_script-${{ matrix.os }}  # Name for the asset
          tag: ${{ github.ref }}  # Tag for the release
